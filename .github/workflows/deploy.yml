name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily rebuild at 06:00 Istanbul, so the post read counts on the site stay fresh.
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build tests (fixtures)
        run: npm run test:build
      - name: Launch check - fails while placeholders remain (yer tutucu kontrolu)
        run: npm run check:launch
      - uses: actions/configure-pages@v6
      - name: Read counts (never fails the build)
        run: node scripts/fetch-read-counts.mjs
      - name: Build site
        run: npm run build
        env:
          SITE_URL: https://klinikterapist.com
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
